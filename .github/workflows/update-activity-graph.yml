name: Update activity graph

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate activity graph
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_USERNAME: QianYan-Art
        run: node scripts/generate-activity-graph.mjs

      - name: Commit updated graph
        shell: bash
        run: |
          if git diff --quiet -- assets/activity.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          git commit -m "chore: update activity graph"
          git push
